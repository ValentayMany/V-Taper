<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="vGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#17202a" />
      <stop offset="100%" stop-color="#090d12" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3.5" flood-color="#10b981" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Modern dark squircle background -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.14)" stroke-width="1.5" />

  <!-- Athletic V-Taper Icon (Broad top tapering down to narrow waist) -->
  <path d="M14 17 L25.5 17 L32 37.5 L38.5 17 L50 17 L36.2 49 C34.4 53 29.6 53 27.8 49 Z" 
        fill="url(#vGrad)" 
        filter="url(#glow)" />

  <!-- Athletic Chevron Core accent -->
  <path d="M22.5 20 L32 41 L41.5 20" 
        fill="none" 
        stroke="rgba(255,255,255,0.45)" 
        stroke-width="1.2" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
</svg>
